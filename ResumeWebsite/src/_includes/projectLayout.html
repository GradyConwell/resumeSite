<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} - Grady Conwell</title>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,100..900,0..100,0..1&family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/styles.css">
    <link rel="icon" href="/assets/images/logo.svg" type="image/svg+xml">

    <!-- Inline script to show tour ribbon if tour is active -->
    <script>
        try {
            if (sessionStorage.getItem('tour_active') === '1') {
                document.documentElement.classList.add('in-tour');
            }
        } catch (e) {}
    </script>

    {% include "analytics.html" %}

    {% if math %}
    <!-- KaTeX renders the $$...$$ equations on pages with math: true in their front matter -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"
        onload="renderMathInElement(document.querySelector('.project-article'))"></script>
    {% endif %}
</head>
<body class="project-page-body">
    {% include "navbar.html" %}

    <main class="content-container project-container">
        {% if projectDate %}
            <p class="project-plain-date">{{ projectDate }}</p>
        {% endif %}

        <article class="project-article">
            {{ content }}
        </article>

        <nav class="project-footer-nav" aria-label="Project navigation">
            <a href="/#projects" class="project-nav-back">← Back to All Projects</a>
        </nav>
    </main>

    {% include "footer.html" %}
</body>
</html>
