[build]
  base = "ResumeWebsite"
  publish = "_site"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "ResumeWebsite/netlify/functions"

[[redirects]]
  from = "/tour"
  to = "/guided-tour/"
  status = 302

[[redirects]]
  from = "/assets/pdf/*"
  to = "/"
  status = 302
